apiVersion: v1
kind: Service
metadata:
  name: {{ include "orders-api.fullname" . }}
  labels:
    {{- include "orders-api.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  # Only meaningful for LoadBalancer/NodePort; setting it on a ClusterIP
  # Service is rejected by the API server.
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  # Firewalls the Azure public IP at the LB, before traffic ever reaches a node.
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      # Named target port: the Deployment can move off 3000 without touching
      # the Service.
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "orders-api.selectorLabels" . | nindent 4 }}
