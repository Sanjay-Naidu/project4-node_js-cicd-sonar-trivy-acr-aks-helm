version: 2

# Keeping dependencies current is the cheapest way to keep the Trivy gate
# green. Without this, the blocking image scan eventually fails on a CVE that
# has had a patch available for months.

updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    groups:
      # One PR for all patch/minor bumps: individually they are noise, and
      # batching means one CI run instead of fifteen.
      production-minor:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
      development:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]
    # Majors stay separate - they need a human to read the changelog.

  - package-ecosystem: maven
    directory: /app
    schedule:
      interval: monthly
    labels: [dependencies, build]

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: monthly
    labels: [dependencies, terraform]
