name: Bootstrap lockfile

# One-time helper: generates app/package-lock.json and commits it.
#
# `npm ci` - used by both the Maven build and the Dockerfile - requires a
# committed lockfile, and a lockfile must be generated by npm rather than
# written by hand. Run this once immediately after creating the repository if
# you do not have Node installed locally; after that, Dependabot and normal
# `npm install` keep it current.

on:
  workflow_dispatch:
    inputs:
      update:
        description: Refresh an existing lockfile to the latest allowed versions
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  lockfile:
    name: Generate and commit package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve the dependency tree
        working-directory: app
        run: |
          if [ -f package-lock.json ] && [ "${{ inputs.update }}" != "true" ]; then
            echo "package-lock.json already exists and update was not requested."
            echo "Re-run with 'update' checked to refresh it."
            exit 0
          fi
          # --package-lock-only resolves and writes the lockfile without
          # installing node_modules or running any lifecycle script.
          npm install --package-lock-only --no-audit --no-fund

      - name: Sanity check the resolved tree
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test

      - name: Commit
        run: |
          # `git status --porcelain`, not `git diff`: on the first run the
          # lockfile is untracked, and `git diff` reports no change for a file
          # git has never seen.
          if [ -z "$(git status --porcelain -- app/package-lock.json)" ]; then
            echo "Lockfile unchanged - nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package-lock.json
          git commit -m "chore: generate package-lock.json

          Produced by the Bootstrap lockfile workflow. Required by 'npm ci' in
          both the Maven build and the Docker image build."
          git push

      - name: Summary
        run: |
          {
            echo "### Lockfile ready"
            echo ""
            echo "\`app/package-lock.json\` is committed. CI can now run \`npm ci\`."
            echo ""
            echo "Next: run **Infrastructure → apply** to create the Azure resources."
          } >> "$GITHUB_STEP_SUMMARY"
